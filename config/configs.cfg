# =============================================================================
# Open Agent Harness · 配置文件
#
# 约定：
#   · 本文件进仓库，**只放非敏感配置**（地址、端口、开关、阈值）
#   · 口令 / 密钥 / 签名盐 **一律走环境变量**（下面的 KEY_SECRET 等留空即可）
#       变量名规则：PA_<SECTION>_<KEY>，全部大写
#       例：PA_DB_MYSQL_PASS、PA_LLM_DEEPSEEK_API_KEY、PA_APP_SECRET_KEY
#   · 优先级：环境变量 > 本文件 > 代码默认值
#
# 一份配置跑所有环境；不同环境靠部署时注入不同的环境变量区分。
# =============================================================================

[db]
# MySQL：平台业务库（会话、消息、RBAC、工具元数据、审计等）
mysql_host = 127.0.0.1
mysql_port = 3306
mysql_user = agent
# 口令走环境变量：PA_DB_MYSQL_PASS
mysql_pass =
mysql_db = open_agent_harness

[llm]
# 对话模型（需较强 function calling 能力）；兼容任何 OpenAI 协议网关
# 密钥走环境变量：PA_LLM_DEEPSEEK_API_KEY
deepseek_api_key =
deepseek_model = deepseek-v4-pro
deepseek_base_url = https://api.deepseek.com/v1

[redis]
# 权限快照、列表缓存、限流计数；没有 Redis 也能跑，只是每次查库
redis_host = 127.0.0.1
redis_port = 6379
# 口令走环境变量：PA_REDIS_REDIS_PASSWORD
redis_password =
redis_db = 0
# 集群模式（true 时用下面的 nodes，忽略 host/port）
# 单机 Redis：cluster=false，填 host/port
# Redis Cluster：**必须** cluster=true 并填 nodes（单机模式会发 SELECT，集群直接拒绝，
#   表现是「限流/去重/权限缓存全部静默降级」——接口 200 但保护都没了）
redis_cluster = false
redis_nodes =

[agent]
# 单条沙箱命令超时（秒）
shell_timeout = 30

# PostgreSQL：LangGraph checkpointer（对话状态持久化）
# **启动必需**：lifespan 里的 init_async() 连不上就抛异常，服务直接退出（没有内存降级）
# 口令走环境变量：PA_AGENT_PG_PASS（前缀是 section 名 AGENT，不是 PG）
pg_host = 127.0.0.1
pg_port = 5432
pg_db = open_agent_harness
pg_user = postgres
pg_pass =

# OpenShell 沙箱（每个用户一个隔离容器）
# 沙箱是必需组件：没有开关。openshell CLI 不可用时服务直接拒绝启动，
# 避免出现"能聊天但执行类工具全都不可用"的半残状态。
openshell_bin = /snap/bin/openshell
openshell_policy = config/sandbox-policy.yaml
openshell_image = pa-sandbox:1.3
sandbox_exec_timeout = 60
sandbox_max_output = 200000
sandbox_cpu = 1
# 注意单位写法：OpenShell 只认 512Mi / 1Gi / 8G，写成 1GiB 会被拒（报参数非法）
sandbox_memory = 1Gi

# 上下文治理：单轮注入的历史字符预算、单轮最长秒数、最大工具步数
context_char_budget = 24000
# 单轮墙钟上限；步数上限设正数生效，0 = 不限制
turn_max_seconds = 3600
turn_max_steps = 200

# 工具授权
tool_admin_users = admin
tool_write_scope = all
tool_exec_scope = all

# 技能工具按需披露（技能多了再开）
skill_tools_lazy = false
# 子代理：默认关；需要并行拆任务时打开
enable_subagent = false

[observability]
langsmith_tracing = false
# 密钥走环境变量：PA_OBSERVABILITY_LANGSMITH_API_KEY
langsmith_api_key =
langsmith_project = open-agent-harness
langsmith_endpoint = https://api.smith.langchain.com

[mcp]
# MCP（Model Context Protocol）：把别人的工具接进来，自动出现在模型工具清单里。
# 只支持 streamable_http：在「技能与工具 → MCP 服务」页由管理员填 名称 + 地址（+ 鉴权头），
# 参数全在地址的 query 串和请求头里，不需要在配置里声明任何服务。
enabled = true
timeout = 30

[app]
# Flask session 签名密钥：**必须**通过环境变量注入（PA_APP_SECRET_KEY）
# 生成：python -c "import secrets;print(secrets.token_hex(32))"
# 多 worker 必须一致，否则登录态随机失效
secret_key =

# 登录口令：留空 = 免密（内网演示 / 本机试用）；对外提供服务时用 PA_APP_LOGIN_PASSWORD 注入
# 所有用户共用这一个口令（要分账号请改 AuthUtil._authenticate）
login_password =

# 已废弃：免密直登 /test-login 端点已删除，本项不再生效（保留仅为兼容老配置）
test_login_enabled = false

# 新用户首次登录自动分配的角色（角色在 RBAC 页面里建）
default_role = default

# 接口报错时是否返回原始异常信息（false = 只返回通用提示，避免泄露内部细节）
error_detail = false

# 跨域白名单（逗号分隔，例如 https://crm.example.com,https://oa.example.com）
# 留空 = 同源部署，不下发任何 CORS 头（默认，也最安全）
# 注意：允许携带凭据（Cookie）时**不能**写 "*"；真需要写 "*" 时服务会自动关闭凭据
cors_origins =

[kb]
# 知识库（文档 RAG，pgvector）。关掉后 /api/kb/* 返回 404，kb_search 工具拒绝
enabled = true
# 独立 PG 库；口令走环境变量 PA_KB_PG_PASS（留空则复用 [agent] 的 pg_pass）
pg_db = kb
max_conns = 4
# 本地嵌入/重排服务（独立进程，默认只监听 127.0.0.1）
embed_url = http://127.0.0.1:5110
# 向量维度，必须与嵌入模型一致（bge-m3 / e5-large = 1024；mpnet-base = 768）
dim = 1024
rerank_timeout_ms = 200
# 向量表名（LlamaIndex 会建 data_kb_nodes，含 HNSW 索引）
table_name = kb_nodes
# 切分：中文按字符计。bge-m3 输入上限 512 token，约等于 350 汉字，
# 超过会被截断丢内容，所以这里按 350 字/块、重叠 60 字
chunk_size = 350
chunk_overlap = 60
# 混合召回：两路各取多少条、融合后留多少条给重排
vec_top = 40
fuse_top = 20
# 上传限制与落盘目录（留空 = <仓库>/data/kb）
max_file_mb = 20
data_dir =

# OCR（扫描件）：无文字层的 PDF 逐页渲染后交给视觉模型识别
# 网关必须是 OpenAI 协议（/chat/completions + image_url）；留空 = 不启用 OCR
# 建议填内网自建网关，扫描件不进公网
ocr_enabled = true
ocr_base_url =
ocr_model =
ocr_dpi = 150
ocr_max_pages = 30
ocr_timeout_s = 120
# 密钥走环境变量 PA_KB_OCR_API_KEY，不要写在这里
ocr_api_key =
