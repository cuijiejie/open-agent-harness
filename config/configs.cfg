# =============================================================================
# Open Agent Harness · 配置文件
#
# 约定：
#   · 本文件进仓库，**只放非敏感配置**（地址、端口、开关、阈值）
#   · 口令 / 密钥 / 签名盐 **一律走环境变量**（下面的 KEY_SECRET 等留空即可）
#       变量名规则：PA_<SECTION>_<KEY>，全部大写
#       例：PA_DB_MYSQL_PASS、PA_LLM_DEEPSEEK_API_KEY、PA_APP_SECRET_KEY
#   · 优先级：环境变量 > 本文件 > 代码默认值
#
# 一份配置跑所有环境；不同环境靠部署时注入不同的环境变量区分。
# =============================================================================

[db]
# MySQL：平台业务库（会话、消息、RBAC、工具元数据、审计等）
mysql_host = 127.0.0.1
mysql_port = 3306
mysql_user = agent
# 口令走环境变量：PA_DB_MYSQL_PASS
mysql_pass =
mysql_db = open_agent_harness

[llm]
# 对话模型（需较强 function calling 能力）；兼容任何 OpenAI 协议网关
# 密钥走环境变量：PA_LLM_DEEPSEEK_API_KEY
deepseek_api_key =
deepseek_model = deepseek-v4-pro
deepseek_base_url = https://api.deepseek.com/v1

[redis]
# 权限快照、列表缓存、限流计数；没有 Redis 也能跑，只是每次查库
redis_host = 127.0.0.1
redis_port = 6379
# 口令走环境变量：PA_REDIS_REDIS_PASSWORD
redis_password =
redis_db = 0
# 集群模式（true 时用下面的 nodes，忽略 host/port）
# 单机 Redis：cluster=false，填 host/port
# Redis Cluster：**必须** cluster=true 并填 nodes（单机模式会发 SELECT，集群直接拒绝，
#   表现是「限流/去重/权限缓存全部静默降级」——接口 200 但保护都没了）
redis_cluster = false
redis_nodes =

[agent]
# 单条沙箱命令超时（秒）
shell_timeout = 30

# PostgreSQL：LangGraph checkpointer（对话状态持久化）
# **启动必需**：lifespan 里的 init_async() 连不上就抛异常，服务直接退出（没有内存降级）
# 口令走环境变量：PA_AGENT_PG_PASS（前缀是 section 名 AGENT，不是 PG）
pg_host = 127.0.0.1
pg_port = 5432
pg_db = open_agent_harness
pg_user = postgres
pg_pass =

# OpenShell 沙箱（每个用户一个隔离容器）
# false = 只保留对话与工具，不启用沙箱执行能力（最小可运行模式）
openshell_enabled = false
openshell_bin = /snap/bin/openshell
openshell_policy = config/sandbox-policy.yaml
openshell_image = pa-sandbox:1.3
sandbox_exec_timeout = 60
sandbox_max_output = 200000
sandbox_cpu = 1
sandbox_memory = 1GiB

# 上下文治理：单轮注入的历史字符预算、单轮最长秒数、最大工具步数
context_char_budget = 24000
turn_max_seconds = 900
turn_max_steps = 40

# 工具授权
tool_admin_users = admin
tool_write_scope = all
tool_exec_scope = all

# 技能工具按需披露（技能多了再开）
skill_tools_lazy = false
# 子代理：默认关；需要并行拆任务时打开
enable_subagent = false

[observability]
langsmith_tracing = false
# 密钥走环境变量：PA_OBSERVABILITY_LANGSMITH_API_KEY
langsmith_api_key =
langsmith_project = open-agent-harness
langsmith_endpoint = https://api.smith.langchain.com

[mcp]
# 外部 MCP 服务（stdio）。只有管理员能声明，用户不可自装。
# 格式：servers = 名称|命令|参数1 参数2|环境变量K=V;K2=V2   （多服务用 ; 分隔）
enabled = false
servers =
timeout = 30

[app]
# Flask session 签名密钥：**必须**通过环境变量注入（PA_APP_SECRET_KEY）
# 生成：python -c "import secrets;print(secrets.token_hex(32))"
# 多 worker 必须一致，否则登录态随机失效
secret_key =

# 登录口令：留空 = 免密（内网演示 / 本机试用）；对外提供服务时用 PA_APP_LOGIN_PASSWORD 注入
# 所有用户共用这一个口令（要分账号请改 AuthUtil._authenticate）
login_password =

# 已废弃：免密直登 /test-login 端点已删除，本项不再生效（保留仅为兼容老配置）
test_login_enabled = false

# 新用户首次登录自动分配的角色（角色在 RBAC 页面里建）
default_role = default

# 接口报错时是否返回原始异常信息（false = 只返回通用提示，避免泄露内部细节）
error_detail = false
