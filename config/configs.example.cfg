# =============================================================================
# Open Agent Harness · 配置示例
#
# 用法（二选一）：
#   ① 复制成真实配置再填：
#        cp config/configs.example.cfg config/configs.cfg
#        # 环境切换：FLASK_CONFIG=dev|pro|uat，会优先找 config/<env>/configs.cfg
#   ② 全部走环境变量（容器化推荐，不用落地文件）：
#        变量名规则 = PA_<SECTION>_<KEY>，全部大写
#        例：PA_DB_MYSQL_PASS=xxx  PA_LLM_DEEPSEEK_API_KEY=sk-xxx
#        优先级：环境变量 > 本文件 > 代码里的默认值
#
# 安全约定：本文件会被提交进仓库，**任何真实口令、密钥都不许写进来**。
# =============================================================================

[db]
# MySQL：平台业务库（会话、消息、RBAC、工具元数据、审计等，见 docs/部署说明.md）
mysql_host = 127.0.0.1
mysql_port = 3306
mysql_user = agent
mysql_pass = CHANGE_ME
mysql_db = open_agent_harness

[llm]
# 对话模型（需要较强的 function calling 能力）
# 默认兼容任何 OpenAI 协议的网关；官方直连填 https://api.deepseek.com/v1
deepseek_api_key = CHANGE_ME
deepseek_model = deepseek-v4-pro
deepseek_base_url = https://api.deepseek.com/v1

[redis]
# 权限快照、列表缓存、限流计数都放这里；没有 Redis 也能跑，只是每次查库
redis_host = 127.0.0.1
redis_port = 6379
redis_password =
redis_db = 0
# 集群模式（true 时用下面的 nodes，忽略 host/port）
redis_cluster = false
redis_nodes =

[agent]
# 单条沙箱命令超时（秒）
shell_timeout = 30

# PostgreSQL：LangGraph 的 checkpointer（对话状态持久化）
# 不配也能跑，但刷新/重启后无法恢复上下文
pg_host = 127.0.0.1
pg_port = 5432
pg_db = postgres
pg_user = postgres
pg_pass = CHANGE_ME

# OpenShell 沙箱（每个用户一个隔离容器）。
# false = 只保留对话与工具，不启用沙箱执行能力（最小可运行模式）
openshell_enabled = false
openshell_bin = /snap/bin/openshell
openshell_policy = config/sandbox-policy.yaml
openshell_image = pa-sandbox:1.3
sandbox_exec_timeout = 60
sandbox_max_output = 200000
sandbox_cpu = 1
sandbox_memory = 1GiB

# 上下文治理：单轮注入的历史字符预算、单轮最长秒数、最大工具步数
context_char_budget = 24000
turn_max_seconds = 900
turn_max_steps = 40

# 工具授权
# tool_admin_users：逗号分隔的“工具管理员”账号（可改工具中文名/分组等元数据）
tool_admin_users = admin
tool_write_scope = all
tool_exec_scope = all

# 技能工具按需披露：技能多了再开（只有读过 SKILL.md 的技能才露出它的工具）
skill_tools_lazy = false
# 子代理：默认关；需要并行拆任务时打开
enable_subagent = false

[observability]
langsmith_tracing = false
langsmith_api_key =
langsmith_project = open-agent-harness
langsmith_endpoint = https://api.smith.langchain.com

[mcp]
# 外部 MCP 服务（stdio）。只有管理员能在这里声明，用户不可自装。
# 格式：servers = 名称|命令|参数1 参数2|环境变量K=V;K2=V2   （多服务用 ; 分隔）
# 示例：servers = my_tools|python|-m my_mcp_server|API_KEY=xxx
enabled = false
servers =
timeout = 30

[app]
# Flask session 签名密钥：生产必须换成随机值，
# 生成：python -c "import secrets;print(secrets.token_hex(32))"
secret_key = CHANGE_ME_RANDOM_32_BYTES
# 登录口令：留空 = 免密登录（内网演示 / 本机试用）；
# 对外提供服务时务必设置一个口令，所有用户共用（要分账号请改 AuthUtil._authenticate）
login_password =
# 免密直登入口 /test-login（给脚本做冒烟测试用）：对外提供服务时必须 false
test_login_enabled = true
# 新用户首次登录自动分配的角色（角色在 RBAC 页面里建）
default_role = default
